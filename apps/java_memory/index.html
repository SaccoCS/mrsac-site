<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Memory Visualizer</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; color: #172033; background: #f4f7fb; font-family: Arial, sans-serif; }
    main { max-width: 1280px; margin: auto; padding: 24px; } h1 { margin: 0; } p { color: #536176; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(340px, 1fr); gap: 18px; margin-top: 18px; }
    .panel { background: white; border: 1px solid #d6deea; border-radius: 8px; padding: 16px; } textarea { width: 100%; min-height: 330px; margin-top: 8px; padding: 12px; border: 1px solid #aebccc; border-radius: 6px; font: 14px/1.55 Consolas, monospace; resize: vertical; }
    button { padding: 9px 13px; border: 1px solid #8da0b7; border-radius: 5px; background: #fff; color: #172033; font-weight: bold; cursor: pointer; } button.primary { background: #0b5cab; border-color: #0b5cab; color: white; } button:disabled { opacity: .45; cursor: not-allowed; }
    .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .memory { display: grid; grid-template-columns: minmax(110px, .7fr) 56px minmax(150px, 1fr); gap: 8px; }.memory h2 { font-size: 18px; margin: 0 0 18px; }.cell { padding: 10px 12px; background: #e5eef9; min-height: 88px; font: 13px Consolas, monospace; }.object { padding: 8px 0; margin-top: 8px; font: 13px Consolas, monospace; }.line { margin: 12px 0 0; min-height: 20px; font: 13px Consolas, monospace; color: #30435e; }.trace { margin-top: 10px; border: 1px solid #cbd5e1; overflow: hidden; font: 13px/1.5 Consolas, monospace; }.trace-row { display: grid; grid-template-columns: 38px 1fr; padding: 4px 8px; }.trace-row.active { background: #fff76b; font-weight: bold; }.trace-row .number { color: #64748b; }.reference-arrows { padding-top: 48px; display: grid; gap: 13px; }
    @media (max-width: 800px) { main { padding: 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Java Memory Visualizer</h1>
    <p>Edit a focused Java example, then step through it to see local variables on the stack and objects on the heap. This models declarations, object construction, reference assignments, and field writes.</p>
    <div class="grid">
      <section class="panel"><label><strong>Java code</strong><textarea id="code" spellcheck="false">Person first = new Person("Ada", 16);
Person friend = first;
friend.name = "Grace";
int year = 2026;</textarea></label><label style="display:block;margin-top:12px"><strong>Class definitions</strong><textarea id="classes" style="min-height:130px" spellcheck="false" placeholder="class Person {&#10;  String name;&#10;  int age;&#10;}"></textarea></label><div class="controls"><button id="previous">Previous</button><button id="next" class="primary">Next</button><button id="reset">Reset</button></div><div id="trace" class="trace"></div></section>
      <div class="memory"><section><h2>Frames</h2><div id="stack"></div></section><div id="arrows" class="reference-arrows"></div><section><h2>Objects</h2><div id="heap"></div></section></div>
    </div>
  </main>
  <script>
    const code = document.querySelector('#code'), classes = document.querySelector('#classes'), stackNode = document.querySelector('#stack'), heapNode = document.querySelector('#heap'), traceNode = document.querySelector('#trace'), arrowsNode = document.querySelector('#arrows');
    let step = 0, snapshots = [];
    const escape = value => String(value).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    function build() { const stack = {}, heap = [], schemas = new Map(); let objectNumber = 0, sourceDefinitions = classes.value + '\n' + code.value; for (const match of sourceDefinitions.matchAll(/class\s+(\w+)\s*\{/g)) { let depth = 1, end = match.index + match[0].length; while (end < sourceDefinitions.length && depth) { if (sourceDefinitions[end] === '{') depth++; if (sourceDefinitions[end] === '}') depth--; end++; } const body = sourceDefinitions.slice(match.index + match[0].length, end - 1), constructor = body.match(new RegExp(match[1] + '\\s*\\(([^)]*)\\)\\s*\\{([\\s\\S]*?)\\}')), fields = body.split(/\r?\n/).map(line => line.trim().match(/^(?:private\s+|public\s+|protected\s+)?(?:static\s+)?[\w<>\[\]]+\s+(\w+)\s*;/)).filter(Boolean).map(field => field[1]); schemas.set(match[1], { fields, params: constructor ? constructor[1].split(',').map(item => item.trim().split(/\s+/).pop()).filter(Boolean) : [], lines: constructor ? constructor[2].split(/\r?\n/).map(line => line.trim()).filter(Boolean) : [] }); } const mainFrame = () => ({ name: 'main', values: { ...stack } }); snapshots = [{ line: 0, source: 'Program start', stack: {}, heap: [], frames: [mainFrame()] }]; code.value.split(/\r?\n/).forEach((raw, index) => { const source = raw.trim(); if (!source || source.startsWith('//')) return; const create = source.match(/^(?:[\w<>\[\]]+\s+)?(\w+)\s*=\s*new\s+(\w+)\s*\((.*)\)\s*;?$/), field = source.match(/^(\w+)\.(\w+)\s*=\s*(.+);?$/), declaration = source.match(/^[\w<>\[\]]+\s+(\w+)\s*=\s*(.+);?$/), assignment = source.match(/^(\w+)\s*=\s*(.+);?$/); const value = (expression, values = stack) => { const clean = expression.trim().replace(/;$/, ''); return values[clean] || clean; }, copyHeap = () => heap.map(item => ({ ...item, fields: { ...item.fields } })); if (create) { const [, variable, className, args] = create, id = className.toLowerCase() + '-' + (++objectNumber), schema = schemas.get(className) || { fields: [], params: [], lines: [] }, fields = {}, argsValues = args.split(',').map(item => item.trim()).filter(Boolean).map(arg => value(arg)); schema.fields.forEach(fieldName => fields[fieldName] = 'null'); heap.push({ id, className, fields }); if (schema.lines.length) { snapshots.push({ line: index + 1, source: className + ' object allocated', stack: { ...stack }, heap: copyHeap(), frames: [mainFrame()] }); const values = { this: 'ref: ' + id }; argsValues.forEach((arg, i) => values[schema.params[i] || ('arg' + (i + 1))] = arg); const constructorFrame = { name: className + ' constructor', values }; snapshots.push({ line: index + 1, source: 'enter ' + className + ' constructor', stack: { ...stack }, heap: copyHeap(), frames: [mainFrame(), constructorFrame] }); schema.lines.forEach(line => { const write = line.match(/^this\.(\w+)\s*=\s*(.+);?$/); if (!write) return; heap.find(item => item.id === id).fields[write[1]] = value(write[2], values); snapshots.push({ line: index + 1, source: line, stack: { ...stack }, heap: copyHeap(), frames: [mainFrame(), constructorFrame] }); }); } else argsValues.forEach((arg, i) => fields[schema.fields[i] || ('arg' + (i + 1))] = arg); stack[variable] = 'ref: ' + id; } else if (field) { const target = heap.find(item => item.id === (stack[field[1]] || '').replace(/^ref:\s*/, '')); if (target) target.fields[field[2]] = value(field[3]); } else if (declaration || assignment) { const match = declaration || assignment; stack[match[1]] = value(match[2]); } snapshots.push({ line: index + 1, source, stack: { ...stack }, heap: copyHeap(), frames: [mainFrame()] }); }); step = Math.min(step, snapshots.length - 1); render(); }
    function render() { const current = snapshots[step] || snapshots[0], frames = current.frames || [{ name: 'main', values: current.stack }], references = frames.flatMap(frame => Object.entries(frame.values).filter(([, value]) => value.startsWith('ref: '))); traceNode.innerHTML = code.value.split(/\r?\n/).map((source, index) => '<div class="trace-row' + (current.line === index + 1 ? ' active' : '') + '"><span class="number">' + (index + 1) + '</span><span>' + (escape(source) || '&nbsp;') + '</span></div>').join(''); stackNode.innerHTML = frames.map(frame => '<div class="cell"><b>' + escape(frame.name) + '</b><div style="display:grid;gap:8px;margin-top:14px">' + Object.entries(frame.values).map(([name, value]) => '<div><b>' + escape(name) + '</b>' + (value.startsWith('ref: ') ? '<div style="font-size:11px;color:#166534">ref</div>' : '<div>' + escape(value) + '</div>') + '</div>').join('') + '</div></div>').join(''); arrowsNode.innerHTML = references.map(([name, value]) => '<svg viewBox="0 0 56 20" width="56" height="20" aria-label="' + escape(name) + ' references ' + escape(value.slice(5)) + '"><path d="M 1 16 C 18 16, 27 3, 48 7" fill="none" stroke="#0369a1" stroke-width="1.4" /><path d="M 48 7 L 42 3 M 48 7 L 41 11" fill="none" stroke="#0369a1" stroke-width="1.4" /></svg>').join(''); heapNode.innerHTML = current.heap.length ? current.heap.map(item => '<div class="object"><div style="color:#475569">' + escape(item.className) + '</div><b>' + escape(item.id) + '</b><div style="padding-left:10px;margin-top:6px">' + Object.entries(item.fields).map(([field, value]) => '<div>' + escape(field) + ' = ' + escape(value) + '</div>').join('') + '</div></div>').join('') : '<small>No objects allocated yet.</small>'; document.querySelector('#previous').disabled = step === 0; document.querySelector('#next').disabled = step >= snapshots.length - 1; }
    code.addEventListener('input', () => { step = 0; build(); }); classes.addEventListener('input', () => { step = 0; build(); }); document.querySelector('#previous').onclick = () => { step--; render(); }; document.querySelector('#next').onclick = () => { step++; render(); }; document.querySelector('#reset').onclick = () => { step = 0; render(); }; build();
  </script>
</body>
</html>
