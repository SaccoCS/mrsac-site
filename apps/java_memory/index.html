<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Memory Visualizer</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; color: #172033; background: #f4f7fb; font-family: Arial, sans-serif; }
    main { max-width: 1280px; margin: auto; padding: 24px; } h1 { margin: 0; } p { color: #536176; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(340px, 1fr); gap: 18px; margin-top: 18px; }
    .panel { background: white; border: 1px solid #d6deea; border-radius: 8px; padding: 16px; } textarea { width: 100%; min-height: 330px; margin-top: 8px; padding: 12px; border: 1px solid #aebccc; border-radius: 6px; font: 14px/1.55 Consolas, monospace; resize: vertical; }
    button { padding: 9px 13px; border: 1px solid #8da0b7; border-radius: 5px; background: #fff; color: #172033; font-weight: bold; cursor: pointer; } button.primary { background: #0b5cab; border-color: #0b5cab; color: white; } button:disabled { opacity: .45; cursor: not-allowed; }
    .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .memory { display: grid; gap: 14px; }.memory h2 { font-size: 18px; margin: 0 0 9px; }.cell { padding: 8px 10px; margin-top: 6px; border: 1px solid #bad5f5; background: #eff7ff; font: 13px Consolas, monospace; }.object { padding: 10px; margin-top: 8px; border: 1px solid #b9e5c4; background: #effcf2; font: 13px Consolas, monospace; }.line { margin: 12px 0 0; min-height: 20px; font: 13px Consolas, monospace; color: #30435e; }
    @media (max-width: 800px) { main { padding: 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Java Memory Visualizer</h1>
    <p>Edit a focused Java example, then step through it to see local variables on the stack and objects on the heap. This models declarations, object construction, reference assignments, and field writes.</p>
    <div class="grid">
      <section class="panel"><label><strong>Java code</strong><textarea id="code" spellcheck="false">Person first = new Person("Ada", 16);
Person friend = first;
friend.name = "Grace";
int year = 2026;</textarea></label><div class="controls"><button id="previous">Previous</button><button id="next" class="primary">Next</button><button id="reset">Reset</button></div><div id="line" class="line"></div></section>
      <div class="memory"><section class="panel"><h2>Stack</h2><div id="stack"></div></section><section class="panel"><h2>Heap</h2><div id="heap"></div></section></div>
    </div>
  </main>
  <script>
    const code = document.querySelector('#code'), stackNode = document.querySelector('#stack'), heapNode = document.querySelector('#heap'), lineNode = document.querySelector('#line');
    let step = 0, snapshots = [];
    const escape = value => String(value).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    function build() { const stack = {}, heap = []; let objectNumber = 0; snapshots = [{ line: 0, source: 'Program start', stack: {}, heap: [] }]; code.value.split(/\r?\n/).forEach((raw, index) => { const source = raw.trim(); if (!source || source.startsWith('//')) return; const create = source.match(/^(?:[\w<>\[\]]+\s+)?(\w+)\s*=\s*new\s+(\w+)\s*\((.*)\)\s*;?$/), field = source.match(/^(\w+)\.(\w+)\s*=\s*(.+);?$/), declaration = source.match(/^[\w<>\[\]]+\s+(\w+)\s*=\s*(.+);?$/), assignment = source.match(/^(\w+)\s*=\s*(.+);?$/); const value = expression => { const clean = expression.trim().replace(/;$/, ''); return stack[clean] || (/^".*"$/.test(clean) ? clean.slice(1, -1) : clean); }; if (create) { const [, variable, className, args] = create, id = className.toLowerCase() + '-' + (++objectNumber), fields = {}; args.split(',').map(x => x.trim()).filter(Boolean).forEach((arg, i) => fields['arg' + (i + 1)] = value(arg)); heap.push({ id, className, fields }); stack[variable] = 'ref: ' + id; } else if (field) { const target = heap.find(item => item.id === (stack[field[1]] || '').replace(/^ref:\s*/, '')); if (target) target.fields[field[2]] = value(field[3]); } else if (declaration || assignment) { const match = declaration || assignment; stack[match[1]] = value(match[2]); } snapshots.push({ line: index + 1, source, stack: { ...stack }, heap: heap.map(item => ({ ...item, fields: { ...item.fields } })) }); }); step = Math.min(step, snapshots.length - 1); render(); }
    function render() { const current = snapshots[step] || snapshots[0]; lineNode.textContent = 'Line ' + current.line + ': ' + current.source; stackNode.innerHTML = Object.keys(current.stack).length ? Object.entries(current.stack).map(([name, value]) => '<div class="cell"><b>' + escape(name) + '</b> = ' + escape(value) + '</div>').join('') : '<small>No local variables yet.</small>'; heapNode.innerHTML = current.heap.length ? current.heap.map(item => '<div class="object"><b>' + escape(item.id) + '</b> : ' + escape(item.className) + '<div style="padding-left:10px;margin-top:6px">' + Object.entries(item.fields).map(([field, value]) => '<div>' + escape(field) + ' = ' + escape(value) + '</div>').join('') + '</div></div>').join('') : '<small>No objects allocated yet.</small>'; document.querySelector('#previous').disabled = step === 0; document.querySelector('#next').disabled = step >= snapshots.length - 1; }
    code.addEventListener('input', () => { step = 0; build(); }); document.querySelector('#previous').onclick = () => { step--; render(); }; document.querySelector('#next').onclick = () => { step++; render(); }; document.querySelector('#reset').onclick = () => { step = 0; render(); }; build();
  </script>
</body>
</html>
