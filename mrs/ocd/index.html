
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disorders Matching Activity</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .instructions {
      font-size: 13px;
      color: #5f5e5a;
      background: #ebebea;
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .instructions strong { color: #1a1a18; font-weight: 500; }

    .score-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .score-pill {
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid #c0bfb8;
      color: #5f5e5a;
      background: #ebebea;
    }
    .score-pill span { font-weight: 500; color: #1a1a18; }

    .progress-bg {
      background: #ebebea;
      border-radius: 4px;
      height: 4px;
      margin-bottom: 1.25rem;
    }
    .progress-fill {
      height: 4px;
      border-radius: 4px;
      background: #378ADD;
      transition: width 0.3s;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .columns { grid-template-columns: 1fr; }
    }

    .col-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888780;
      margin-bottom: 8px;
    }

    .card {
      background: #ffffff;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #1a1a18;
      cursor: pointer;
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
      line-height: 1.5;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .card.term { font-weight: 500; }
    .card:hover { border-color: #888780; background: #f1efe8; }
    .card.selected { border: 2px solid #378ADD; background: #E6F1FB; color: #0C447C; }
    .card.correct { border: 2px solid #3B6D11; background: #EAF3DE; color: #3B6D11; cursor: default; pointer-events: none; }
    .card.wrong { border: 2px solid #A32D2D; background: #FCEBEB; color: #A32D2D; }

    .feedback {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      color: #5f5e5a;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 8px;
      border: 0.5px solid #c0bfb8;
      background: transparent;
      color: #1a1a18;
      transition: background 0.12s;
    }
    button:hover { background: #ebebea; }
    button.primary { background: #185FA5; color: #E6F1FB; border-color: #185FA5; }
    button.primary:hover { background: #0C447C; }

    .complete-msg { display: none; text-align: center; margin-top: 1.5rem; }
    .complete-msg h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .complete-msg p { font-size: 13px; color: #5f5e5a; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>Disorders matching activity</h1>
  <div class="instructions">
    Match each <strong>disorder name</strong> → <strong>clinical description</strong> → <strong>patient vignette</strong>. Select one card from each column to form a group of three.
  </div>

  <div class="score-bar">
    <div class="score-pill">Matched: <span id="score">0</span> / 7</div>
    <div class="score-pill">Attempts: <span id="attempts">0</span></div>
  </div>
  <div class="progress-bg"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="columns">
    <div><div class="col-label">Disorder</div><div id="terms"></div></div>
    <div><div class="col-label">Description</div><div id="defs"></div></div>
    <div><div class="col-label">Patient vignette</div><div id="vigs"></div></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="complete-msg" id="complete-msg">
    <h2 id="result-text"></h2>
    <p id="result-sub"></p>
    <div class="btn-row">
      <button class="primary" onclick="resetGame()">Play again</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {
    id: 0,
    term: "OCD",
    def: "Recurring unwanted thoughts and/or repetitive behaviors performed to reduce anxiety — e.g., checking, counting, or cleaning rituals.",
    vig: "Maria spends 2+ hours each morning checking that the stove is off, returning home multiple times before work. She knows it's irrational, but the dread won't lift until she checks again."
  },
  {
    id: 1,
    term: "Hoarding Disorder",
    def: "Persistent difficulty discarding possessions regardless of value, causing significant clutter and distress; not better explained by another disorder.",
    vig: "James's home has narrow paths between floor-to-ceiling piles of newspapers, broken appliances, and bags. He becomes distraught at any suggestion of throwing things away, insisting everything might be needed someday."
  },
  {
    id: 2,
    term: "PTSD",
    def: "Intrusive symptoms (flashbacks, nightmares), avoidance, negative cognitions, and hyperarousal lasting more than one month following exposure to a traumatic event.",
    vig: "A combat veteran, David startles violently at car backfires, has vivid nightmares of firefights, and refuses to discuss his deployment. He feels emotionally numb around his family and has been symptomatic for six months."
  },
  {
    id: 3,
    term: "Acute Stress Disorder",
    def: "Trauma-related intrusion, dissociation, avoidance, and arousal symptoms lasting 3 days to one month after a traumatic event.",
    vig: "Two weeks after a serious car accident, Priya feels detached from her surroundings, can't stop seeing the crash replaying in her mind, and avoids driving entirely. Her symptoms began within days of the event."
  },
  {
    id: 4,
    term: "Dissociative Amnesia",
    def: "Inability to recall important autobiographical information, usually of a traumatic nature, that is too extensive to be explained by ordinary forgetting.",
    vig: "Following a house fire in which she lost her child, Elena cannot recall any events from the past three years of her life. Neurological testing shows no organic cause for her memory loss."
  },
  {
    id: 5,
    term: "Dissociative Fugue",
    def: "A subtype of dissociative amnesia involving purposeful travel or confused wandering, coupled with amnesia for one's identity or past.",
    vig: "Police found Tom 400 miles from home working at a diner under a different name. He had no memory of his family or how he got there, and was genuinely confused when shown his own ID."
  },
  {
    id: 6,
    term: "Dissociative Identity Disorder",
    def: "Presence of two or more distinct personality states or identities, with recurrent gaps in memory for everyday events, personal information, or traumatic events.",
    vig: "Sara's therapist has met three distinct identities who differ in age, voice, and handwriting. Sara herself frequently 'loses' hours of the day and finds objects she doesn't remember buying or notes written in unfamiliar handwriting."
  }
];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
let terms, defs, vigs, matched, attempts, sel;

function init() {
  terms = shuffle(DATA.map(d => ({id: d.id, text: d.term, col: 'term'})));
  defs  = shuffle(DATA.map(d => ({id: d.id, text: d.def,  col: 'def'})));
  vigs  = shuffle(DATA.map(d => ({id: d.id, text: d.vig,  col: 'vig'})));
  matched = new Set(); attempts = 0; sel = {};
  document.getElementById('attempts').textContent = 0;
  document.getElementById('complete-msg').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  updateScore(); render();
}

function render() {
  renderCol('terms', terms, 'term card');
  renderCol('defs',  defs,  'def card');
  renderCol('vigs',  vigs,  'vig card');
}

function renderCol(containerId, items, baseClass) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    const isMatched = matched.has(item.id);
    el.className = baseClass + (isMatched ? ' correct' : '');
    el.textContent = item.text;
    if (!isMatched) el.onclick = () => handleClick(item.col, item.id);
    if (sel[item.col] === item.id && !isMatched) el.classList.add('selected');
    c.appendChild(el);
  });
}

function handleClick(col, id) {
  if (matched.has(id)) return;
  clearWrong();
  const fb = document.getElementById('feedback');
  sel[col] = (sel[col] === id) ? null : id;
  render();
  const filled = ['term','def','vig'].filter(c => sel[c] != null);
  if (filled.length === 3) {
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    if (sel.term === sel.def && sel.def === sel.vig) {
      matched.add(sel.term); sel = {};
      updateScore();
      fb.style.color = '#3B6D11'; fb.textContent = '✓ Correct match!';
      render();
      if (matched.size === DATA.length) showComplete();
    } else {
      fb.style.color = '#A32D2D'; fb.textContent = '✗ Not a match — try again.';
      markWrong();
      setTimeout(() => { sel = {}; clearWrong(); render(); fb.textContent = ''; }, 950);
    }
  } else {
    fb.style.color = '#5f5e5a';
    fb.textContent = filled.length + ' of 3 selected…';
  }
}

function markWrong() { document.querySelectorAll('.selected').forEach(e => { e.classList.remove('selected'); e.classList.add('wrong'); }); }
function clearWrong() { document.querySelectorAll('.wrong').forEach(e => e.classList.remove('wrong')); }

function updateScore() {
  document.getElementById('score').textContent = matched.size;
  document.getElementById('progress').style.width = (matched.size / DATA.length * 100) + '%';
}

function showComplete() {
  document.getElementById('complete-msg').style.display = 'block';
  const acc = Math.round((DATA.length / attempts) * 100);
  document.getElementById('result-text').textContent = '🎉 All matched!';
  document.getElementById('result-sub').textContent = attempts + ' attempt' + (attempts !== 1 ? 's' : '') + ' · ' + acc + '% accuracy';
}

function resetGame() { init(); }
init();
</script>
</body>
</html>
